name: TermX
options:
  bundleIdPrefix: dev.tgiap
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: TermX
targets:
  TermX:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: libvtutil
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.tgiap.TermX
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "$(inherited)"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/TermX-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/libvtutil"
    entitlements:
      path: Resources/TermX.entitlements
